name: Build Android APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: 检出源码
    uses: actions/checkout@v4

  - name: 配置 JDK 17
    uses: actions/setup-java@v5
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: 配置 Python 3.13
    uses: actions/setup-python@v5
    with:
      python-version: '3.13'

  - name: 检查 Python 运行环境并创建符号链接
    run: |
      which python
      python --version
      # 确保系统能通过 python3.13 命令直接调用
      sudo ln -sf $(which python) /usr/local/bin/python3.13 || true
      python3.13 --version

  - name: 赋予 gradlew 执行权限
    run: chmod +x android/gradlew

  - name: 执行 Gradle 打包 Debug APK
    run: |
      cd android
      ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

  - name: 上传 APK 产物
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: 12306-helper-debug-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
      retention-days: 7
